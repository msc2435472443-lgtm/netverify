name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # 只用 ubuntu-latest 跑「不依赖网络命名空间」的部分。
    # 端到端（netns 仿真 + 真实抓包）在本地跑并录屏——原因见 docs/why-no-netns-ci.md
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest -q

      - name: Validate all cases in cases/
        run: python -m netverify.validate cases
