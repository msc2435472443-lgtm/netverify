name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # 只用 ubuntu-latest 跑「不依赖网络命名空间」的部分。
    # 端到端（netns 仿真 + 真实抓包）在本地跑并录屏——原因见 docs/why-no-netns-ci.md
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 不在列表里：ubuntu-latest（现在已经是 26.04）的镜像里没有 3.9，
        # setup-python 会直接报 "The version '3.9' ... was not found for Ubuntu 26.04"。
        # 这是托管 runner 的镜像漂移，不是我们的代码问题，所以把矩阵挪到还有的版本上。
        # 最低支持的 Python 版本仍以 pyproject.toml 的 requires-python 为准。
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest -q

      - name: Validate all cases in cases/
        run: python -m netverify.validate cases
